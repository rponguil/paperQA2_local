# Configuración principal del sistema
system:
  name: "paperqa2-local"
  version: "1.0.0"
  debug: false
  cache_dir: "~/.paperqa2-local/cache"
  logs_dir: "~/.paperqa2-local/logs"

# Configuración GROBID
grobid:
  server_url: "http://localhost:8070"
  timeout: 60
  retry_attempts: 3
  cache_results: true
  services:
    - "processFulltextDocument"
    - "processHeaderDocument"
    - "processReferences"

# Configuración extractores
extraction:
  primary_extractor: "grobid"
  fallback_extractor: "pypdf"
  quality_threshold: 0.7
  chunk_size: 5000
  chunk_overlap: 200
  section_aware_chunking: true

# Configuración LLMs locales
llm:
  provider: "auto"  # auto, ollama, lmstudio
  default_model: "llama3.2:8b"
  embedding_model: "mxbai-embed-large"
  temperature: 0.1
  max_tokens: 4096
  timeout: 120

# Configuración RAG
rag:
  evidence_k: 10
  max_sources: 5
  answer_length: "about 200 words, but can be longer"
  citation_style: "detailed"
  enable_reranking: true

# Configuración vector store
vector_store:
  type: "numpy"  # numpy, qdrant, chroma
  similarity_metric: "cosine"
  index_type: "flat"
