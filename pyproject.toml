[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperqa2-local"
version = "1.0.0"
authors = [
  { name="Jules", email="jules@example.com" },
]
description = "A local RAG system using GROBID and local LLMs, based on PaperQA2."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/user/paperqa2-local"
"Bug Tracker" = "https://github.com/user/paperqa2-local/issues"
